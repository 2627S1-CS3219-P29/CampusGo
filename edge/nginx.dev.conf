# lets WebSocket connections (the chat) through: "upgrade" when the browser asks for one
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name edge_dev;

    # mapping /api/* to backend api gateway. strips /api in final call
    location ~ ^/api/(.*)$ {
        set $target_api_gateway api_gateway;
        proxy_pass http://$target_api_gateway:80/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keep chat WebSockets open, and allow image uploads (the chat service caps images at 2 MB)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 3m;
    }

    # vite dev server
    location / {
        set $target_frontend frontend_dev;
        proxy_pass http://$target_frontend:5173;
        
        # see: https://aronschueler.de/blog/2024/07/29/enabling-hot-module-replacement-hmr-in-vite-with-nginx-reverse-proxy/
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
