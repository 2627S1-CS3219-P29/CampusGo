global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # These are the received application metrics, not the Collector's own /metrics.
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: [127.0.0.1:9464]

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

  # Broker health is independent of application OTLP exports. Port 15692 stays internal.
  - job_name: rabbitmq
    static_configs:
      - targets: [${BROKER_METRICS_HOST}:15692]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count, queue_delivery_metrics]
    static_configs:
      - targets: [${BROKER_METRICS_HOST}:15692]
    metric_relabel_configs:
      - source_labels: [queue]
        regex: '^(user|credit|order)\..*'
        action: keep
