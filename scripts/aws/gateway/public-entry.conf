# AWS entry point in the same Nginx process as the team's original API router.
# The original public routing listener is bound to loopback inside this image.
server {
    listen 80;
    server_name _;
    location = /health { access_log off; return 200 'ok'; }
    location = /api { return 403; }
    location /api/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 3m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket/image URLs can contain access tokens in the query string.
        access_log off;
    }
    location / {
        set $frontend frontend.campusgo.local;
        proxy_pass http://$frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
