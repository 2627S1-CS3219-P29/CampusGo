networks:
  public_net:
  private_net:
    # internal: true

services:
  # reverse proxy for backend api routing
  api_gateway:
    image: nginx:1.31-alpine
    # restart: unless-stopped
    ports:
      - "8000:80"
      # - "8080:8080"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public_net
      - private_net

  # user service
  user_db:
    image: postgres:18-alpine
    container_name: user_postgres_db
    # restart: always
    networks: [private_net]
    environment:
      POSTGRES_PASSWORD: ${USER_DB_PW}
      POSTGRES_DB: users
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - user_pgdata:/var/lib/postgresql
  user_dev:
    build:
      context: ./user-service
      target: development
      network: host
    profiles: ["dev"]
    ports:
      - "8001:3000"
    volumes:
      - ./user-service:/app
      - /app/node_modules
    networks:
      private_net:
        aliases:
          - user_api
    environment:
      NODE_ENV: development
      DATABASE_URL: ${USER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}
    # command: deno task dev
    # workaround for docker in wsl
    command: deno run -A https://deno.land/x/denon/denon.ts dev
  user_prod:
    build:
      context: ./user-service
      target: production
      network: host
    profiles: ["prod"]
    networks:
      private_net:
        aliases:
          - user_api
    environment:
      NODE_ENV: production
      DATABASE_URL: ${USER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}

volumes:
  user_pgdata:
