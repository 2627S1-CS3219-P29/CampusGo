networks:
  public_net:
  private_net:
    # internal: true

services:
  # reverse proxy for backend api routing
  api_gateway:
    image: nginx:1.31-alpine
    # restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8081:8080" # exposes private endpoint for testing, should not be visible to public
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public_net
      - private_net
    depends_on:
      - user_${PROFILE}
      - supplier_${PROFILE}
      - order_${PROFILE}
      - rabbitmq

  edge_dev:
    image: nginx:1.31-alpine
    profiles: ["dev"]
    ports:
      - "8000:80"
    volumes:
      - ./edge/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public_net
    depends_on:
      - api_gateway
      - frontend_dev

  # frontend
  frontend_dev:
    build:
      context: ./frontend
      target: development
      network: host
    profiles: ["dev"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - public_net
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}

  # event queue
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "127.0.0.1:5672:5672" # amqp
      - "127.0.0.1:15672:15672" # management ui
    networks: [private_net]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbitmq_management path_prefix "/rabbitmq"'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # user service
  user_db:
    image: postgres:18-alpine
    container_name: user_postgres_db
    # restart: always
    networks: [private_net]
    environment:
      POSTGRES_PASSWORD: ${USER_DB_PW}
      POSTGRES_DB: users
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - user_pgdata:/var/lib/postgresql
  user_dev:
    build:
      context: ./user-service
      target: development
      network: host
    profiles: ["dev"]
    ports:
      - "8001:3000"
    volumes:
      - ./user-service:/app
      - /app/node_modules
    networks:
      private_net:
        aliases:
          - user_api
    environment:
      NODE_ENV: development
      DATABASE_URL: ${USER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}
      RABBITMQ_CONNECTION: ${RABBITMQ_CONNECTION}
    # command: deno task dev
    # workaround for docker in wsl
    command: sh -c "deno task db:update_dev && deno run -A https://deno.land/x/denon/denon.ts dev"
  user_prod:
    build:
      context: ./user-service
      target: production
      network: host
    profiles: ["prod"]
    networks:
      private_net:
        aliases:
          - user_api
    environment:
      NODE_ENV: production
      DATABASE_URL: ${USER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}

  # supplier service
  supplier_db:
    image: postgres:18-alpine
    container_name: supplier_postgres_db
    networks: [private_net]
    environment:
      POSTGRES_PASSWORD: ${SUPPLIER_DB_PW}
      POSTGRES_DB: suppliers
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - supplier_pgdata:/var/lib/postgresql
  supplier_dev:
    build:
      context: ./supplier-service
      target: development
      network: host
    profiles: ["dev"]
    ports:
      - "8002:3000"
    volumes:
      - ./supplier-service:/app
      - /app/node_modules
    networks:
      private_net:
        aliases:
          - supplier_api
    environment:
      NODE_ENV: development
      DATABASE_URL: ${SUPPLIER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    # workaround for docker in wsl
    command: deno run -A https://deno.land/x/denon/denon.ts dev
  supplier_prod:
    build:
      context: ./supplier-service
      target: production
      network: host
    profiles: ["prod"]
    networks:
      private_net:
        aliases:
          - supplier_api
    environment:
      NODE_ENV: production
      DATABASE_URL: ${SUPPLIER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}

  # order service
  order_db:
    image: postgres:18-alpine
    container_name: order_postgres_db
    networks: [private_net]
    environment:
      POSTGRES_PASSWORD: ${ORDER_DB_PW}
      POSTGRES_DB: orders
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - order_pgdata:/var/lib/postgresql
    # lets order_dev wait until postgres accepts connections before syncing the schema
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 2s
      timeout: 3s
      retries: 15
  order_dev:
    build:
      context: ./order-service
      target: development
      network: host
    profiles: ["dev"]
    ports:
      - "8003:8000"
    volumes:
      - ./order-service:/app
      - /app/node_modules
    networks:
      private_net:
        aliases:
          - order_api
    depends_on:
      order_db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: ${ORDER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    # sync the schema, then start with denon (workaround for docker in wsl)
    command: sh -c "deno task db:push && deno run -A https://deno.land/x/denon/denon.ts dev"
  order_prod:
    build:
      context: ./order-service
      target: production
      network: host
    profiles: ["prod"]
    networks:
      private_net:
        aliases:
          - order_api
    depends_on:
      order_db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${ORDER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}

volumes:
  user_pgdata:
  supplier_pgdata:
  order_pgdata:
  rabbitmq_data:
