services:
  # user service
  user_db:
    image: postgres:18-alpine
    container_name: user_postgres_db
    # restart: always
    environment:
      POSTGRES_PASSWORD: ${USER_DB_PW}
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - user_pgdata:/var/lib/postgresql
  user_dev:
    build:
      context: ./user-service
      target: development
    profiles: ["dev"]
    ports:
      - "8001:8001"
    volumes:
      - ./user-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: ${USER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}
      PORT: 8001
    # command: deno task dev
    # workaround for docker in wsl
    command: deno run -A https://deno.land/x/denon/denon.ts dev
  user_prod:
    build:
      context: ./user-service
      target: production
    profiles: ["prod"]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${USER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}

volumes:
  user_pgdata:
